<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title description">
  <title id="title">Vivado Launcher 蓝色图标视觉稿</title>
  <desc id="description">AMD 官方箭头几何，蓝底白标。浅深背景与 16、24、32、48 像素对照。当前为审核稿。</desc>
  <defs>
    <symbol id="brand" viewBox="0 0 48 48">
      <path fill="#0067C0" d="M0 0h48v48H0z"/>
      <svg x="8" y="8" width="32" height="32" viewBox="106.4 0 33.33 33.33" fill="#FFFFFF">
        <polygon points="130.64 9.08 115.75 9.08 106.68 0 139.72 0 139.72 33.05 130.64 23.97 130.64 9.08"/>
        <polygon points="115.74 23.98 115.74 10.9 106.4 20.24 106.4 33.33 119.48 33.33 128.82 23.98 115.74 23.98"/>
      </svg>
    </symbol>
  </defs>
  <rect width="1120" height="700" fill="#F7F7F7"/>
  <g font-family="Segoe UI, Microsoft YaHei UI, sans-serif" fill="#1F1F1F">
    <text x="48" y="60" font-size="27" font-weight="600">同一个箭头，换成蓝色。</text>
    <text x="48" y="90" font-size="14" fill="#5E6B7C">Vivado Launcher · 图标审核稿 03 · 官方 SVG 几何提取</text>
    <path d="M48 116H1072" stroke="#DDE2E8"/>
    <rect x="48" y="144" width="496" height="306" fill="#FFFFFF" stroke="#DDE2E8"/>
    <rect x="576" y="144" width="496" height="306" fill="#202020"/>
    <text x="72" y="176" font-size="13" fill="#5E6B7C">浅色背景</text>
    <text x="600" y="176" font-size="13" fill="#BBBBBB">深色背景</text>
    <use href="#brand" x="232" y="204" width="128" height="128"/>
    <use href="#brand" x="760" y="204" width="128" height="128"/>
    <path d="M72 362H520" stroke="#DDE2E8"/>
    <path d="M600 362H1048" stroke="#454545"/>
    <use href="#brand" x="72" y="386" width="36" height="36"/>
    <text x="120" y="402" font-size="16" font-weight="600">Vivado Launcher</text>
    <text x="120" y="421" font-size="11" fill="#5E6B7C">工程启动器</text>
    <use href="#brand" x="600" y="386" width="36" height="36"/>
    <text x="648" y="402" font-size="16" font-weight="600" fill="#F3F3F3">Vivado Launcher</text>
    <text x="648" y="421" font-size="11" fill="#BBBBBB">工程启动器</text>
    <text x="48" y="492" font-size="14" font-weight="600">实际尺寸</text>
    <text x="48" y="514" font-size="12" fill="#5E6B7C">请在 100% 缩放下查看</text>
    <use href="#brand" x="248" y="484" width="16" height="16"/>
    <use href="#brand" x="332" y="480" width="24" height="24"/>
    <use href="#brand" x="424" y="476" width="32" height="32"/>
    <use href="#brand" x="524" y="468" width="48" height="48"/>
    <g font-size="12" fill="#5E6B7C" text-anchor="middle"><text x="256" y="540">16 px</text><text x="344" y="540">24 px</text><text x="440" y="540">32 px</text><text x="548" y="540">48 px</text></g>
    <rect x="624" y="470" width="448" height="72" rx="4" fill="#202020"/>
    <use href="#brand" x="652" y="494" width="24" height="24"/>
    <rect x="657" y="526" width="14" height="3" rx="1.5" fill="#78BEFF"/>
    <text x="700" y="506" font-size="13" fill="#F3F3F3">任务栏效果示意</text>
    <text x="700" y="526" font-size="11" fill="#BBBBBB">下划线属于任务栏，不写入图标文件</text>
    <path d="M48 574H1072" stroke="#DDE2E8"/>
    <rect x="48" y="600" width="20" height="20" fill="#0067C0"/>
    <text x="80" y="615" font-size="13">#0067C0</text>
    <rect x="204" y="600" width="20" height="20" fill="#FFFFFF" stroke="#DDE2E8"/>
    <text x="236" y="615" font-size="13">#FFFFFF</text>
    <text x="412" y="615" font-size="13" fill="#5E6B7C">直角方底 · 原始箭头比例 · 无渐变、无阴影</text>
    <text x="48" y="660" font-size="12" fill="#5E6B7C">本稿仅用于外观审核；生产 ICO 与 WPF 资源在审核后由同一 SVG 生成。</text>
  </g>
